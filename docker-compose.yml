services:
  tb-score-ii-clinical-severity:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      AUDIT_SECRET_KEY: ${AUDIT_SECRET_KEY:?Set a strong AUDIT_SECRET_KEY in the environment}
      AUDIT_READ_TOKEN: ${AUDIT_READ_TOKEN:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
